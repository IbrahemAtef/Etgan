<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0e"/>
      <stop offset="50%" stop-color="#0d171d"/>
      <stop offset="100%" stop-color="#041f17"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- خلفية الزجاجية والدرع الإسلامي -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- زخرفة هندسية إسلامية ثمانية الأضلاع -->
  <g transform="translate(256, 230) scale(1.15)">
    <!-- المربع الأول -->
    <rect x="-105" y="-105" width="210" height="210" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 6" opacity="0.4"/>
    <!-- المربع الثاني بزاوية 45 درجة -->
    <rect x="-105" y="-105" width="210" height="210" rx="20" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" transform="rotate(45)" opacity="0.6"/>

    <!-- أيقونة المصحف الشريف المفتوح -->
    <path d="M-80,45 C-40,20 -10,35 0,55 C10,35 40,20 80,45 L80,-40 C40,-65 10,-50 0,-30 C-10,-50 -40,-65 -80,-40 Z" 
          fill="url(#emeraldGrad)" filter="url(#glow)"/>
    <path d="M-75,40 C-38,18 -8,32 0,50 C8,32 38,18 75,40 L75,-35 C38,-58 8,-44 0,-25 C-8,-44 -38,-58 -75,-35 Z" 
          fill="#0a1318" opacity="0.85"/>

    <!-- خطوط المصحف الذهبية -->
    <line x1="-60" y1="-15" x2="-15" y2="-5" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-60" y1="5" x2="-15" y2="15" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-60" y1="25" x2="-20" y2="32" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

    <line x1="60" y1="-15" x2="15" y2="-5" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="5" x2="15" y2="15" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="25" x2="20" y2="32" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- فاصل المصحف الأوسط وشعلة النور -->
    <line x1="0" y1="-26" x2="0" y2="52" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="0" cy="-55" r="7" fill="url(#goldGrad)" filter="url(#glow)"/>
  </g>

  <!-- النص العربي الكوفي الحديث: إِتْقَانْ -->
  <text x="256" y="435" text-anchor="middle" font-family="'Cairo', 'Amiri', Arial, sans-serif" font-size="64" font-weight="900" fill="#f8fafc" letter-spacing="2">
    إِتْـقَـانْ
  </text>
  <text x="256" y="470" text-anchor="middle" font-family="'Cairo', Arial, sans-serif" font-size="20" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">
    إِدَارَةُ حَلَقَاتِ القُرْآنِ
  </text>
</svg>
